name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: cargo build --release --locked
      - name: Boot smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          python3 scripts/qemu_smoke.py
      - name: Checksums
        run: |
          cp target/x86_64-unknown-uefi/release/sail.efi sail.efi
          sha256sum sail.efi > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" sail.efi SHA256SUMS --generate-notes --title "$GITHUB_REF_NAME"
